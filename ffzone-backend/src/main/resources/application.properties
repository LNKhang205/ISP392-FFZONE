spring.application.name=ffzone-backend

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ffzone
spring.datasource.username=ffzone
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ── JWT ───────────────────────────────────────────────────────
# Secret phải >= 32 ký tự để dùng HS256
app.jwt.secret=ffzone-super-secret-key-2026-must-be-at-least-256-bits-long
app.jwt.expiration-ms=86400000

# ── Google OAuth2 ─────────────────────────────────────────────
# Thay YOUR_CLIENT_ID và YOUR_CLIENT_SECRET bằng giá trị từ Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
