spring.application.name=ffzone-backend

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ffzone
spring.datasource.username=ffzone
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ── JWT ───────────────────────────────────────────────────────
# Secret phải >= 32 ký tự để dùng HS256
app.jwt.secret=ffzone-super-secret-key-2026-must-be-at-least-256-bits-long
app.jwt.expiration-ms=86400000

# ── Google OAuth2 ─────────────────────────────────────────────
# Thay YOUR_CLIENT_ID và YOUR_CLIENT_SECRET bằng giá trị từ Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=placeholder-not-configured
spring.security.oauth2.client.registration.google.client-secret=placeholder-not-configured
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ── VNPay Sandbox ─────────────────────────────────────────────
vnpay.tmn-code=5BDZWBY7
vnpay.hash-secret=FURCSD1104XLUF07UKYXPTTDJXV1DVVK
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# vnp_ReturnUrl gửi cho VNPay — PHẢI là URL BACKEND (không phải frontend),
# vì backend cần verify chữ ký (vnp_SecureHash) trước khi cho user thấy kết quả.
vnpay.backend-return-url=http://localhost:8080/api/payments/vnpay-return

# Trang FE hiển thị kết quả cuối cùng cho user — backend tự redirect tới đây
# SAU KHI đã verify xong, không gửi trực tiếp cho VNPay.
vnpay.frontend-result-url=http://localhost:5173/payment-result

# IPN URL — cần public qua ngrok, khai báo trên Merchant Admin VNPay
vnpay.ipn-url=http://localhost:8080/api/payments/vnpay-ipn
server.error.include-stacktrace=always
server.error.include-message=always
logging.level.org.springframework.web=DEBUG
logging.level.com.ffzone=DEBUG